// /ftp.cfg for FTP-Backup (TinyC). Lines with // are comments.
// FRITZ!Box: its IP, not fritz.box (over IPv6 the box refuses passive mode)
HOST=192.168.178.1
// user with access to NAS contents
USER=fritzuser
// password of that user
PW=fritzpassword
// folder for the backups, it must exist
DIR=/Tasmota
// optional: subfolder of this device, empty = its MQTT topic
NAME=
// optional: 1 = save this file with the password too
ALL=0
