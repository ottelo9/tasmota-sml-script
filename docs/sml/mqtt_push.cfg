// /mqtt_push.cfg for MQTT-Push (TinyC). Lines with // are comments.
// where to send, e.g. a go-e charger (serial number instead of 123456)
TOPIC=go-eCharger/123456/ids/set
// the message; %sml1% .. %sml6% = values 1..6 of the meter (1 = power in W),
// %-sml1% = the same with the sign turned
JSON={"pGrid":%sml1%,"pPv":0,"pAkku":0}
// seconds between two messages
EVERY=5
// smoothing in seconds, 0 = off
SMOOTH=0
