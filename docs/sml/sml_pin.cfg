// /sml_pin.cfg for Zähler-PIN (TinyC). Lines with // are comments.
// the PIN from your grid operator
PIN=1234
// send it by itself after a power cut (1 = yes, 0 = only with the button)
AUTO=1
// light on / light off per pulse, pause after each digit, in ms
ON=200
OFF=200
GAP=1500
// single pulses before the first digit (some meters need 1 or 2 to wake up)
WAKE=0
// pulses for the digit 0: 10 or 0
ZERO=10
// 1 = the LED lights at LOW (most reading heads), 0 = at HIGH
INV=1
// GPIO of the IR LED, -1 = the TX pin from the SML settings
GPIO=-1
